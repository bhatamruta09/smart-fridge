<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="fridge-icon">🧊</span>
      <h2>Welcome back</h2>
      <p>Log in to your fridge</p>
    </div>

    <form (ngSubmit)="onLogin()" class="auth-form">
      <label>Username</label>
      <input type="text" [(ngModel)]="loginData.username" name="username" required />

      <label>Password</label>
      <input type="password" [(ngModel)]="loginData.password" name="password" required />

      <button type="submit" class="btn-primary">Log in</button>
    </form>

    <p *ngIf="errorMessage" class="message error">{{ errorMessage }}</p>

    <p class="switch-link">New here? <a routerLink="/register">Create an account</a></p>
  </div>
</div>
